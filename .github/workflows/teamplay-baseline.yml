name: Teamplay baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: teamplay-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:pr
      - run: npx vitest run tests/teamplayFoundation.test.ts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run build:mobile
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.bundle.config.ts

  android-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build:mobile
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew lintDebug assembleDebug --no-daemon
        working-directory: android

  ios-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mobile
      - run: npx cap sync ios
      - run: node scripts/normalize-capacitor-swift-path.mjs
      - run: >-
          xcodebuild build
          -project ios/App/App.xcodeproj
          -scheme App
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
